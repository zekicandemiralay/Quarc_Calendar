<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Quarc Calendar</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var s = JSON.parse(localStorage.getItem('quarc_calendar_settings') || '{}');
        var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark || !s.theme) document.documentElement.classList.add('dark');
        if (s.theme === 'light') document.documentElement.classList.remove('dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
